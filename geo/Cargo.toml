[package]
name = "attica-geo"
version = "0.1.0"
edition = "2021"
description = "Εύρεση τοποθεσίας φωτογραφίας στην Αττική: MobileCLIP-S0 + Mirage OCR πάνω στις εικόνες του Wikidata"
publish = false

[[bin]]
name = "attica-geo"
path = "src/main.rs"

[dependencies]
mobileclip-s0 = { path = "../ext/mc/rust" }
mirage-rs = { path = "../../Cactus Mirage - PureRust" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp", "gif"] }
serde_json = "1"
lzma-rs = "0.3"
kamadak-exif = "0.6"
imageproc = { version = "0.25", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
